[project]
name = "tripcut"
version = "0.1.0"
description = "旅遊素材 AI 剪輯 pipeline：本機分析 → 腳本 → 剪輯決策 → 渲染"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "typer>=0.12",
  "jsonschema>=4.21",
  "pillow>=10.3",
  "pillow-heif>=0.16",
]

[project.optional-dependencies]
transcribe = [
  "faster-whisper>=1.0",
]
tts = [
  "edge-tts>=6.1",
]
dev = [
  "ruff>=0.6",
  "pyright>=1.1",
]

[project.scripts]
tripcut = "tripcut.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripcut"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
